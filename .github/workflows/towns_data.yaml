name: Auto import towns data

on:
  schedule:
    # Runs every 12 hours at 30 minutes past the hour
    - cron: "30 0,12 * * *"

  workflow_dispatch:

jobs:
  api-request:
    runs-on: ubuntu-latest

    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      MERC_USER: ${{ secrets.MERC_USER }}
      AUTH_TOKEN: ${{ secrets.AUTH_TOKEN }}

    steps:
      - name: Set up repository
        uses: actions/checkout@v3

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Read towns.json, send API requests, and save results
        run: |
          set -e

          SUCCESS=true

          # Directory for individual API responses
          mkdir -p api_responses

          # Read town IDs from towns.json
          TOWN_IDS=$(jq -r '.[] | .id' assets/s8/towns.json)

          # Count towns for logging
          TOTAL_TOWNS=$(echo "$TOWN_IDS" | wc -w)
          CURRENT_TOWN=0

          for town_id in $TOWN_IDS; do
            CURRENT_TOWN=$((CURRENT_TOWN + 1))

            echo "[$CURRENT_TOWN/$TOTAL_TOWNS] Requesting town ID $town_id..."

            endpoint="https://play.mercatorio.io/api/towns/${town_id}"

            # Save response directly to a file.
            # This avoids putting potentially large JSON data
            # into a shell command argument.
            response=$(curl -s \
              -w "%{http_code}" \
              -o "api_responses/${town_id}.json" \
              -X GET \
              "$endpoint" \
              -H "X-Merc-User: $MERC_USER" \
              -H "Authorization: $AUTH_TOKEN")

            # Check HTTP status
            if [[ "$response" == "200" ]]; then
              echo "Request for town ID $town_id was successful"

              # Make sure the response is valid JSON
              if ! jq empty "api_responses/${town_id}.json" 2>/dev/null; then
                echo "Invalid JSON returned for town ID $town_id"
                rm -f "api_responses/${town_id}.json"
                SUCCESS=false
              fi
            else
              echo "Request for town ID $town_id failed with status $response"

              # Remove failed response
              rm -f "api_responses/${town_id}.json"

              SUCCESS=false
            fi

            # Wait 0.20 seconds before the next request
            sleep 0.20
          done

          # Only generate the final files if every request succeeded
          if [ "$SUCCESS" = true ]; then
            echo "All requests were successful."
            echo "Combining API responses..."

            # Combine all individual JSON objects into one array
            jq -s '.' api_responses/*.json > assets/s8/townsData.json

            # Generate ferriesData.json from townsData.json
            jq 'map({
              id: .id,
              name: .name,
              location: .location,
              landings: .landings
            })' \
              assets/s8/townsData.json \
              > assets/s8/ferriesData.json

            echo "Successfully generated:"
            echo "  assets/s8/townsData.json"
            echo "  assets/s8/ferriesData.json"

            # Clean up temporary responses
            rm -rf api_responses

          else
            echo "Some requests failed."
            echo "No changes will be saved."

            # Clean up temporary responses
            rm -rf api_responses

            exit 1
          fi

      - name: Commit and push the JSON files
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git add assets/s8/townsData.json
          git add assets/s8/ferriesData.json

          # Don't fail if there are no changes
          git diff --cached --quiet || \
            git commit -m "Updated townsData.json for season 8"

          git push